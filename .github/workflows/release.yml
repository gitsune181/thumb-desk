name: Build portable web release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  portable-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag matches version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${{ github.ref_name }}"

      - name: Verify source
        run: npm run check

      - name: Build portable web file
        run: npm run build:web-portable

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          asset="release/Thumb-Desk-Web.html"
          title="Thumb Desk Web ${tag}"
          notes="Tải **Thumb-Desk-Web.html**, sau đó bấm đúp file để mở ngay trong Chrome hoặc Edge. Nhập API key Idea Chic cá nhân khi giao diện hỏi lần đầu."
          if gh release view "${tag}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${asset}" --clobber --repo "${{ github.repository }}"
            gh release edit "${tag}" --title "${title}" --notes "${notes}" --repo "${{ github.repository }}"
          else
            gh release create "${tag}" "${asset}" --title "${title}" --notes "${notes}" --repo "${{ github.repository }}"
          fi
