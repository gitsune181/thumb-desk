name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches app version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version v$version"
          }

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run check

      - name: Build one-click installer
        run: npm run dist:win

      - name: Build portable web file
        run: npm run build:web-portable

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release -File | Where-Object { ($_.Extension -in '.exe', '.blockmap', '.html') -or ($_.Name -eq 'latest.yml') } | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" $assets --repo "${{ github.repository }}" --title "Thumb Desk ${{ github.ref_name }}" --generate-notes
